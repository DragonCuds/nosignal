<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071014" />
    <title>NoSignal — آفلاین</title>
    <style>
      :root { color-scheme: dark; font-family: Vazirmatn, Tahoma, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { align-items: center; background: #071014; color: #eafcff; display: grid; margin: 0; min-height: 100dvh; padding: 24px; }
      main { margin: auto; max-width: 360px; text-align: center; }
      img { height: 96px; width: 96px; }
      h1 { font-size: 24px; margin: 20px 0 8px; }
      p { color: #a8c4c9; line-height: 1.8; margin: 0 0 20px; }
      button { background: #21d4d0; border: 0; border-radius: 22px; color: #031012; cursor: pointer; font: inherit; font-weight: 700; min-height: 44px; padding: 0 24px; }
      button:focus-visible { outline: 2px solid #7ffbf7; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/tel-icon.svg" alt="" width="96" height="96" />
      <h1>فعلاً آفلاین هستید</h1>
      <p>برای دیدن و فرستادن پیام‌ها، اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
